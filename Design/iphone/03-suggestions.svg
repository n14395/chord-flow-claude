    <rect x="168" y="4" width="68" height="28" rx="6" fill="#7ED321" opacity="0.12" stroke="#7ED321" stroke-width="1"/>
    <text x="202" y="22" fill="#7ED321" font-size="11" text-anchor="middle" font-weight="500">Fmaj7</text>

    <text x="243" y="22" fill="#3A3D5C" font-size="11">&#x2192;</text>

