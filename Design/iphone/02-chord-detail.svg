<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="dim-overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E0F1D" stop-opacity="0"/>
      <stop offset="40%" stop-color="#0E0F1D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0E0F1D" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="screen-clip2">
      <rect width="390" height="844" rx="40"/>
    </clipPath>
    <style>
      text { font-family: -apple-system, 'SF Pro Rounded', 'Helvetica Neue', sans-serif; }
    </style>
  </defs>

  <!-- Phone frame -->
  <rect width="390" height="844" rx="40" fill="#1A1B2E" stroke="#3A3D5C" stroke-width="2"/>

  <g clip-path="url(#screen-clip2)">

  <!-- Dimmed background (the compose screen behind) -->
  <rect width="390" height="844" fill="#1A1B2E"/>

  <!-- Faint circle of fifths ghost -->
  <circle cx="195" cy="248" r="130" fill="none" stroke="#252740" stroke-width="0.5" opacity="0.4"/>
  <circle cx="195" cy="248" r="80" fill="none" stroke="#252740" stroke-width="0.3" opacity="0.3"/>

  <!-- Dim overlay -->
  <rect width="390" height="844" fill="url(#dim-overlay)"/>

  <!-- ════════════════════════════════════════ -->
  <!-- HALF-SHEET: Chord Detail                 -->
  <!-- ════════════════════════════════════════ -->
  <rect x="0" y="340" width="390" height="504" rx="20" fill="#252740"/>
  <line x1="0" y1="340" x2="390" y2="340" stroke="#3A3D5C" stroke-width="1"/>

  <!-- Sheet handle -->
  <rect x="171" y="350" width="48" height="4" rx="2" fill="#3A3D5C"/>

  <!-- ── Header ── -->
  <g transform="translate(20, 376)">
    <!-- Harmonic function color bar -->
    <rect width="4" height="40" rx="2" fill="#7ED321"/>

    <!-- Chord name + info -->
    <text x="16" y="18" fill="#7ED321" font-size="24" font-weight="700">Fmaj7</text>
    <text x="106" y="18" fill="#7ED321" font-size="14" opacity="0.6" font-weight="500">IV</text>
    <!-- Function badge -->
    <rect x="126" y="4" width="88" height="22" rx="11" fill="#7ED321" opacity="0.12"/>
    <text x="170" y="19" fill="#7ED321" font-size="10" text-anchor="middle" font-weight="500">Subdominant</text>

    <text x="16" y="38" fill="#8B8DA3" font-size="12">Bar 3 of 4  |  F  A  C  E</text>

    <!-- Close button -->
    <circle cx="340" cy="18" r="14" fill="#3A3D5C"/>
    <line x1="334" y1="12" x2="346" y2="24" stroke="#8B8DA3" stroke-width="2" stroke-linecap="round"/>
    <line x1="346" y1="12" x2="334" y2="24" stroke="#8B8DA3" stroke-width="2" stroke-linecap="round"/>
  </g>

  <line x1="20" y1="432" x2="370" y2="432" stroke="#3A3D5C" stroke-width="0.5"/>

  <!-- ── Pattern Selector ── -->
  <text x="20" y="456" fill="#8B8DA3" font-size="10" font-weight="500">PATTERN</text>

  <g transform="translate(20, 468)">
    <!-- Block (default) -->
    <rect width="80" height="52" rx="10" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
    <!-- Block icon: stacked horizontal lines -->
    <rect x="22" y="12" width="36" height="4" rx="2" fill="#6B6D82"/>
    <rect x="22" y="20" width="36" height="4" rx="2" fill="#6B6D82"/>
    <rect x="22" y="28" width="36" height="4" rx="2" fill="#6B6D82"/>
    <text x="40" y="46" fill="#6B6D82" font-size="9" text-anchor="middle">Block</text>

    <!-- Arp Up (SELECTED) -->
    <rect x="90" width="80" height="52" rx="10" fill="#7ED321" opacity="0.12" stroke="#7ED321" stroke-width="1.5"/>
    <!-- Arp up icon: ascending steps -->
    <rect x="106" y="28" width="8" height="4" rx="1" fill="#7ED321"/>
    <rect x="118" y="22" width="8" height="4" rx="1" fill="#7ED321"/>
    <rect x="130" y="16" width="8" height="4" rx="1" fill="#7ED321"/>
    <rect x="142" y="10" width="8" height="4" rx="1" fill="#7ED321"/>
    <text x="130" y="46" fill="#7ED321" font-size="9" text-anchor="middle" font-weight="600">Arp Up</text>

    <!-- Arp Down -->
    <rect x="180" width="80" height="52" rx="10" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
    <!-- Arp down icon: descending steps -->
    <rect x="196" y="10" width="8" height="4" rx="1" fill="#6B6D82"/>
    <rect x="208" y="16" width="8" height="4" rx="1" fill="#6B6D82"/>
    <rect x="220" y="22" width="8" height="4" rx="1" fill="#6B6D82"/>
    <rect x="232" y="28" width="8" height="4" rx="1" fill="#6B6D82"/>
    <text x="220" y="46" fill="#6B6D82" font-size="9" text-anchor="middle">Arp Down</text>

    <!-- Strum -->
    <rect x="270" width="80" height="52" rx="10" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
    <!-- Strum icon: fanned lines -->
    <line x1="296" y1="28" x2="300" y2="10" stroke="#6B6D82" stroke-width="2" stroke-linecap="round"/>
    <line x1="302" y1="28" x2="304" y2="12" stroke="#6B6D82" stroke-width="2" stroke-linecap="round"/>
    <line x1="308" y1="28" x2="308" y2="10" stroke="#6B6D82" stroke-width="2" stroke-linecap="round"/>
    <line x1="314" y1="28" x2="312" y2="12" stroke="#6B6D82" stroke-width="2" stroke-linecap="round"/>
    <line x1="320" y1="28" x2="316" y2="10" stroke="#6B6D82" stroke-width="2" stroke-linecap="round"/>
    <text x="310" y="46" fill="#6B6D82" font-size="9" text-anchor="middle">Strum</text>
  </g>

  <!-- ── Beat Length ── -->
  <text x="20" y="546" fill="#8B8DA3" font-size="10" font-weight="500">LENGTH</text>

  <g transform="translate(20, 558)">
    <!-- 2 beats -->
    <rect width="64" height="40" rx="10" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
    <text x="32" y="25" fill="#8B8DA3" font-size="13" text-anchor="middle" font-weight="500">2</text>

    <!-- 4 beats (SELECTED) -->
    <rect x="74" width="64" height="40" rx="10" fill="#7ED321" opacity="0.12" stroke="#7ED321" stroke-width="1.5"/>
    <text x="106" y="25" fill="#7ED321" font-size="13" text-anchor="middle" font-weight="600">4</text>

    <!-- 8 beats -->
    <rect x="148" width="64" height="40" rx="10" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
    <text x="180" y="25" fill="#8B8DA3" font-size="13" text-anchor="middle" font-weight="500">8</text>

    <text x="230" y="25" fill="#6B6D82" font-size="11">beats</text>
  </g>

  <!-- ── Extensions ── -->
  <text x="20" y="624" fill="#8B8DA3" font-size="10" font-weight="500">EXTENSIONS</text>

  <g transform="translate(20, 636)">
    <!-- 7th (active) -->
    <rect width="56" height="34" rx="8" fill="#7ED321" opacity="0.15" stroke="#7ED321" stroke-width="1.5"/>
    <text x="28" y="22" fill="#7ED321" font-size="12" text-anchor="middle" font-weight="600">7th</text>

    <!-- 9th (inactive) -->
    <rect x="66" width="56" height="34" rx="8" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
    <text x="94" y="22" fill="#6B6D82" font-size="12" text-anchor="middle">9th</text>

    <!-- 11th (inactive) -->
    <rect x="132" width="56" height="34" rx="8" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
    <text x="160" y="22" fill="#6B6D82" font-size="12" text-anchor="middle">11th</text>

    <!-- 13th (inactive) -->
    <rect x="198" width="56" height="34" rx="8" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
    <text x="226" y="22" fill="#6B6D82" font-size="12" text-anchor="middle">13th</text>
  </g>

  <!-- ── Voicing Preview (mini keyboard) ── -->
  <text x="20" y="700" fill="#8B8DA3" font-size="10" font-weight="500">VOICING</text>

  <g transform="translate(20, 712)">
    <!-- Piano keys (1 octave + a bit) -->
    <!-- White keys -->
    <rect x="0" y="0" width="22" height="48" rx="2" fill="#2F3152" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="24" y="0" width="22" height="48" rx="2" fill="#2F3152" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="48" y="0" width="22" height="48" rx="2" fill="#2F3152" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="72" y="0" width="22" height="48" rx="2" fill="#7ED321" opacity="0.3" stroke="#7ED321" stroke-width="1"/>
    <rect x="96" y="0" width="22" height="48" rx="2" fill="#2F3152" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="120" y="0" width="22" height="48" rx="2" fill="#7ED321" opacity="0.3" stroke="#7ED321" stroke-width="1"/>
    <rect x="144" y="0" width="22" height="48" rx="2" fill="#2F3152" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="168" y="0" width="22" height="48" rx="2" fill="#7ED321" opacity="0.3" stroke="#7ED321" stroke-width="1"/>
    <rect x="192" y="0" width="22" height="48" rx="2" fill="#2F3152" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="216" y="0" width="22" height="48" rx="2" fill="#2F3152" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="240" y="0" width="22" height="48" rx="2" fill="#2F3152" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="264" y="0" width="22" height="48" rx="2" fill="#2F3152" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="288" y="0" width="22" height="48" rx="2" fill="#2F3152" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="312" y="0" width="22" height="48" rx="2" fill="#7ED321" opacity="0.3" stroke="#7ED321" stroke-width="1"/>

    <!-- Black keys -->
    <rect x="16" y="0" width="14" height="30" rx="2" fill="#1A1B2E" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="40" y="0" width="14" height="30" rx="2" fill="#1A1B2E" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="88" y="0" width="14" height="30" rx="2" fill="#1A1B2E" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="112" y="0" width="14" height="30" rx="2" fill="#1A1B2E" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="136" y="0" width="14" height="30" rx="2" fill="#1A1B2E" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="184" y="0" width="14" height="30" rx="2" fill="#1A1B2E" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="208" y="0" width="14" height="30" rx="2" fill="#1A1B2E" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="256" y="0" width="14" height="30" rx="2" fill="#1A1B2E" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="280" y="0" width="14" height="30" rx="2" fill="#1A1B2E" stroke="#3A3D5C" stroke-width="0.5"/>
    <rect x="304" y="0" width="14" height="30" rx="2" fill="#1A1B2E" stroke="#3A3D5C" stroke-width="0.5"/>

    <!-- Note labels on active keys -->
    <text x="83" y="44" fill="#7ED321" font-size="7" text-anchor="middle" font-weight="600">F</text>
    <text x="131" y="44" fill="#7ED321" font-size="7" text-anchor="middle" font-weight="600">A</text>
    <text x="179" y="44" fill="#7ED321" font-size="7" text-anchor="middle" font-weight="600">C</text>
    <text x="323" y="44" fill="#7ED321" font-size="7" text-anchor="middle" font-weight="600">E</text>
  </g>

  <!-- ── Action Buttons ── -->
  <g transform="translate(20, 780)">
    <!-- Preview -->
    <rect width="100" height="40" rx="10" fill="#7ED321" opacity="0.12" stroke="#7ED321" stroke-width="1.5"/>
    <text x="50" y="25" fill="#7ED321" font-size="13" text-anchor="middle" font-weight="500">Preview</text>

    <!-- Duplicate -->
    <rect x="112" width="100" height="40" rx="10" fill="#252740" stroke="#3A3D5C" stroke-width="1.5"/>
    <text x="162" y="25" fill="#F0F0F5" font-size="13" text-anchor="middle" font-weight="500">Duplicate</text>

    <!-- Remove -->
    <rect x="224" width="100" height="40" rx="10" fill="#E8435A" opacity="0.12" stroke="#E8435A" stroke-width="1.5"/>
    <text x="274" y="25" fill="#E8435A" font-size="13" text-anchor="middle" font-weight="500">Remove</text>
  </g>

  <!-- Home indicator -->
  <rect x="148" y="832" width="94" height="4" rx="2" fill="#3A3D5C"/>

  </g>

  <!-- Screen label -->
  <text x="195" y="840" fill="#6B6D82" font-size="8" text-anchor="middle">02 — Chord Detail (Half-Sheet) — iPhone</text>
</svg>
