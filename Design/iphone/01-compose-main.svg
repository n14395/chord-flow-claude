<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <radialGradient id="glow-key" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1A1B2E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen-clip">
      <rect width="390" height="844" rx="40"/>
    </clipPath>
    <style>
      text { font-family: -apple-system, 'SF Pro Rounded', 'Helvetica Neue', sans-serif; }
    </style>
  </defs>

  <!-- Phone frame -->
  <rect width="390" height="844" rx="40" fill="#1A1B2E" stroke="#3A3D5C" stroke-width="2"/>

  <g clip-path="url(#screen-clip)">

  <!-- Status bar -->
  <rect width="390" height="54" fill="#1A1B2E"/>
  <text x="30" y="34" fill="#F0F0F5" font-size="14" font-weight="600">9:41</text>
  <text x="340" y="34" fill="#F0F0F5" font-size="12" font-weight="500" text-anchor="end">100%</text>
  <!-- Notch hint -->
  <rect x="130" y="6" width="130" height="28" rx="14" fill="#0E0F1D"/>

  <!-- ════════════════════════════════════════ -->
  <!-- CIRCLE OF FIFTHS                         -->
  <!-- Center: (195, 248), Outer note ring r=130 -->
  <!-- Inner diatonic ring r=80                 -->
  <!-- ════════════════════════════════════════ -->

  <!-- Subtle center glow -->
  <circle cx="195" cy="248" r="150" fill="url(#glow-center)"/>

  <!-- Outer ring track -->
  <circle cx="195" cy="248" r="130" fill="none" stroke="#252740" stroke-width="1"/>

  <!-- Inner ring track -->
  <circle cx="195" cy="248" r="80" fill="none" stroke="#252740" stroke-width="0.5" stroke-dasharray="4 6"/>

  <!-- ── Outer Note Ring (12 notes, Circle of Fifths order) ── -->
  <!-- C (0°) — SELECTED KEY — with glow -->
  <circle cx="195" cy="118" r="26" fill="url(#glow-key)"/>
  <circle cx="195" cy="118" r="18" fill="#F5A623" opacity="0.25" stroke="#F5A623" stroke-width="2"/>
  <text x="195" y="123" fill="#F5A623" font-size="13" text-anchor="middle" font-weight="700">C</text>

  <!-- G (30°) -->
  <circle cx="260" cy="135.4" r="15" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
  <text x="260" y="140" fill="#8B8DA3" font-size="11" text-anchor="middle" font-weight="600">G</text>

  <!-- D (60°) -->
  <circle cx="307.6" cy="183" r="15" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
  <text x="307.6" y="187.5" fill="#8B8DA3" font-size="11" text-anchor="middle" font-weight="600">D</text>

  <!-- A (90°) -->
  <circle cx="325" cy="248" r="15" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
  <text x="325" y="252.5" fill="#8B8DA3" font-size="11" text-anchor="middle" font-weight="600">A</text>

  <!-- E (120°) -->
  <circle cx="307.6" cy="313" r="15" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
  <text x="307.6" y="317.5" fill="#8B8DA3" font-size="11" text-anchor="middle" font-weight="600">E</text>

  <!-- B (150°) -->
  <circle cx="260" cy="360.6" r="15" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
  <text x="260" y="365" fill="#8B8DA3" font-size="11" text-anchor="middle" font-weight="600">B</text>

  <!-- F# (180°) -->
  <circle cx="195" cy="378" r="15" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
  <text x="195" y="382.5" fill="#6B6D82" font-size="11" text-anchor="middle" font-weight="600">F#</text>

  <!-- Db (210°) -->
  <circle cx="130" cy="360.6" r="15" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
  <text x="130" y="365" fill="#6B6D82" font-size="11" text-anchor="middle" font-weight="600">Db</text>

  <!-- Ab (240°) -->
  <circle cx="82.4" cy="313" r="15" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
  <text x="82.4" y="317.5" fill="#6B6D82" font-size="11" text-anchor="middle" font-weight="600">Ab</text>

  <!-- Eb (270°) -->
  <circle cx="65" cy="248" r="15" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
  <text x="65" y="252.5" fill="#6B6D82" font-size="11" text-anchor="middle" font-weight="600">Eb</text>

  <!-- Bb (300°) -->
  <circle cx="82.4" cy="183" r="15" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
  <text x="82.4" y="187.5" fill="#8B8DA3" font-size="11" text-anchor="middle" font-weight="600">Bb</text>

  <!-- F (330°) -->
  <circle cx="130" cy="135.4" r="15" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
  <text x="130" y="140" fill="#8B8DA3" font-size="11" text-anchor="middle" font-weight="600">F</text>

  <!-- ── Inner Diatonic Chord Ring (C Major: I ii iii IV V vi vii°) ── -->

  <!-- I - C (Tonic, 0°) — amber, selected state -->
  <circle cx="195" cy="168" r="24" fill="#F5A623" opacity="0.3" stroke="#F5A623" stroke-width="2"/>
  <text x="195" y="164" fill="#F5A623" font-size="9" text-anchor="middle" font-weight="700">I</text>
  <text x="195" y="177" fill="#F5A623" font-size="10" text-anchor="middle" font-weight="600">Cmaj7</text>

  <!-- V - G (Dominant, 30°) — blue -->
  <circle cx="235" cy="178.7" r="22" fill="#4A90D9" opacity="0.15" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="235" y="175" fill="#4A90D9" font-size="9" text-anchor="middle" font-weight="700">V</text>
  <text x="235" y="187" fill="#4A90D9" font-size="9" text-anchor="middle" font-weight="600">G7</text>

  <!-- ii - D (Subdominant, 60°) — green -->
  <circle cx="264.3" cy="208" r="22" fill="#7ED321" opacity="0.15" stroke="#7ED321" stroke-width="1.5"/>
  <text x="264.3" y="204" fill="#7ED321" font-size="9" text-anchor="middle" font-weight="700">ii</text>
  <text x="264.3" y="216" fill="#7ED321" font-size="9" text-anchor="middle" font-weight="600">Dm7</text>

  <!-- vi - A (Tonic, 90°) — amber -->
  <circle cx="275" cy="248" r="22" fill="#F5A623" opacity="0.15" stroke="#F5A623" stroke-width="1.5"/>
  <text x="275" y="244" fill="#F5A623" font-size="9" text-anchor="middle" font-weight="700">vi</text>
  <text x="275" y="256" fill="#F5A623" font-size="9" text-anchor="middle" font-weight="600">Am7</text>

  <!-- iii - E (Tonic, 120°) — amber -->
  <circle cx="264.3" cy="288" r="22" fill="#F5A623" opacity="0.15" stroke="#F5A623" stroke-width="1.5"/>
  <text x="264.3" y="284" fill="#F5A623" font-size="9" text-anchor="middle" font-weight="700">iii</text>
  <text x="264.3" y="296" fill="#F5A623" font-size="9" text-anchor="middle" font-weight="600">Em7</text>

  <!-- vii° - B (Dominant, 150°) — blue -->
  <circle cx="235" cy="317.3" r="22" fill="#4A90D9" opacity="0.15" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="235" y="313" fill="#4A90D9" font-size="9" text-anchor="middle" font-weight="700">vii°</text>
  <text x="235" y="325" fill="#4A90D9" font-size="8" text-anchor="middle" font-weight="600">Bdim</text>

  <!-- IV - F (Subdominant, 330°) — green -->
  <circle cx="155" cy="178.7" r="22" fill="#7ED321" opacity="0.15" stroke="#7ED321" stroke-width="1.5"/>
  <text x="155" y="175" fill="#7ED321" font-size="9" text-anchor="middle" font-weight="700">IV</text>
  <text x="155" y="187" fill="#7ED321" font-size="9" text-anchor="middle" font-weight="600">Fmaj7</text>

  <!-- ── Borrowed chord hints (outer, dim, dashed) ── -->
  <!-- bIII at Eb position, r=155 -->
  <circle cx="50" cy="248" r="16" fill="#D94A8C" opacity="0.06" stroke="#D94A8C" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="50" y="245" fill="#D94A8C" font-size="8" text-anchor="middle" opacity="0.5" font-weight="600">bIII</text>
  <text x="50" y="255" fill="#D94A8C" font-size="7" text-anchor="middle" opacity="0.4">Eb</text>

  <!-- bVI at Ab position -->
  <circle cx="68" cy="313" r="16" fill="#D94A8C" opacity="0.06" stroke="#D94A8C" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="68" y="310" fill="#D94A8C" font-size="8" text-anchor="middle" opacity="0.5" font-weight="600">bVI</text>
  <text x="68" y="320" fill="#D94A8C" font-size="7" text-anchor="middle" opacity="0.4">Ab</text>

  <!-- bVII at Bb position -->
