  <text x="68" y="180" fill="#D94A8C" font-size="8" text-anchor="middle" opacity="0.5" font-weight="600">bVII</text>
  <text x="68" y="190" fill="#D94A8C" font-size="7" text-anchor="middle" opacity="0.4">Bb</text>

  <!-- Center label — key + mode, tappable -->
