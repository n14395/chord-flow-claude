  <!-- ════════════════════════════════════════ -->
  <!-- PLAYBACK BAR                             -->
  <!-- ════════════════════════════════════════ -->
  <rect x="0" y="696" width="390" height="68" fill="#0E0F1D"/>
  <line x1="0" y1="696" x2="390" y2="696" stroke="#3A3D5C" stroke-width="0.5"/>

  <!-- Progress bar -->
  <rect x="20" y="702" width="350" height="3" rx="1.5" fill="#252740"/>
  <rect x="20" y="702" width="196" height="3" rx="1.5" fill="#F5A623" opacity="0.7"/>
  <circle cx="216" cy="703.5" r="5" fill="#F5A623"/>

