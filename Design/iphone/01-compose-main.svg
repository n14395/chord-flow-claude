  <text x="195" y="262" fill="#8B8DA3" font-size="11" text-anchor="middle">Tap to change mode</text>

  <!-- ════════════════════════════════════════ -->
  <!-- CONTROLS STRIP                           -->
  <!-- ════════════════════════════════════════ -->
  <line x1="20" y1="408" x2="370" y2="408" stroke="#3A3D5C" stroke-width="0.5"/>

  <!-- Tension knob -->
  <g transform="translate(50, 424)">
    <circle cx="0" cy="0" r="22" fill="#252740" stroke="#3A3D5C" stroke-width="1.5"/>
    <path d="M -12.7 15.6 A 22 22 0 1 1 6 21.2" fill="none" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 6 21.2 A 22 22 0 0 1 12.7 15.6" fill="none" stroke="#3A3D5C" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="4" fill="#F0F0F5" font-size="10" text-anchor="middle" font-weight="600">0.6</text>
    <text x="0" y="36" fill="#8B8DA3" font-size="9" text-anchor="middle" font-weight="500">TENSION</text>
  </g>

  <!-- Swing knob -->
  <g transform="translate(145, 424)">
    <circle cx="0" cy="0" r="22" fill="#252740" stroke="#3A3D5C" stroke-width="1.5"/>
    <path d="M -12.7 15.6 A 22 22 0 0 1 -18 -12" fill="none" stroke="#4A90D9" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -18 -12 A 22 22 0 0 1 12.7 15.6" fill="none" stroke="#3A3D5C" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="4" fill="#F0F0F5" font-size="10" text-anchor="middle" font-weight="600">0.2</text>
    <text x="0" y="36" fill="#8B8DA3" font-size="9" text-anchor="middle" font-weight="500">SWING</text>
  </g>

  <!-- Tempo knob -->
  <g transform="translate(240, 424)">
    <circle cx="0" cy="0" r="22" fill="#252740" stroke="#3A3D5C" stroke-width="1.5"/>
    <path d="M -12.7 15.6 A 22 22 0 1 1 0 -22" fill="none" stroke="#7ED321" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 0 -22 A 22 22 0 0 1 12.7 15.6" fill="none" stroke="#3A3D5C" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="4" fill="#F0F0F5" font-size="10" text-anchor="middle" font-weight="600">120</text>
    <text x="0" y="36" fill="#8B8DA3" font-size="9" text-anchor="middle" font-weight="500">BPM</text>
  </g>

  <!-- Borrowed preset pill -->
