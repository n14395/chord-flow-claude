  <line x1="194" y1="498" x2="194" y2="608" stroke="#3A3D5C" stroke-width="1"/>
  <line x1="285" y1="498" x2="285" y2="608" stroke="#3A3D5C" stroke-width="1"/>
  <!-- Beat subdivisions -->
  <line x1="34.8" y1="498" x2="34.8" y2="608" stroke="#1A1B2E" stroke-width="0.5"/>
  <line x1="57.5" y1="498" x2="57.5" y2="608" stroke="#1A1B2E" stroke-width="0.5"/>
  <line x1="80.3" y1="498" x2="80.3" y2="608" stroke="#1A1B2E" stroke-width="0.5"/>
  <line x1="125.8" y1="498" x2="125.8" y2="608" stroke="#1A1B2E" stroke-width="0.5"/>
  <line x1="148.5" y1="498" x2="148.5" y2="608" stroke="#1A1B2E" stroke-width="0.5"/>
  <line x1="171.3" y1="498" x2="171.3" y2="608" stroke="#1A1B2E" stroke-width="0.5"/>
  <line x1="216.8" y1="498" x2="216.8" y2="608" stroke="#1A1B2E" stroke-width="0.5"/>
  <line x1="239.5" y1="498" x2="239.5" y2="608" stroke="#1A1B2E" stroke-width="0.5"/>
  <line x1="262.3" y1="498" x2="262.3" y2="608" stroke="#1A1B2E" stroke-width="0.5"/>
  <line x1="307.8" y1="498" x2="307.8" y2="608" stroke="#1A1B2E" stroke-width="0.5"/>
  <line x1="330.5" y1="498" x2="330.5" y2="608" stroke="#1A1B2E" stroke-width="0.5"/>
  <line x1="353.3" y1="498" x2="353.3" y2="608" stroke="#1A1B2E" stroke-width="0.5"/>

  <!-- Bar numbers -->
  <text x="57" y="516" fill="#6B6D82" font-size="8" text-anchor="middle">1</text>
  <text x="148" y="516" fill="#6B6D82" font-size="8" text-anchor="middle">2</text>
  <text x="239" y="516" fill="#6B6D82" font-size="8" text-anchor="middle">3</text>
  <text x="330" y="516" fill="#6B6D82" font-size="8" text-anchor="middle">4</text>

  <!-- Chord blocks — I → vi → IV → V -->
  <!-- Bar 1: Cmaj7 (Tonic/amber) -->
  <rect x="16" y="524" width="83" height="56" rx="8" fill="#F5A623" opacity="0.12" stroke="#F5A623" stroke-width="1.5"/>
  <text x="57.5" y="549" fill="#F5A623" font-size="14" text-anchor="middle" font-weight="600">Cmaj7</text>
  <text x="57.5" y="566" fill="#F5A623" font-size="9" text-anchor="middle" opacity="0.5">I</text>

  <!-- Bar 2: Am7 (Tonic/amber) -->
  <rect x="107" y="524" width="83" height="56" rx="8" fill="#F5A623" opacity="0.12" stroke="#F5A623" stroke-width="1.5"/>
  <text x="148.5" y="549" fill="#F5A623" font-size="14" text-anchor="middle" font-weight="600">Am7</text>
  <text x="148.5" y="566" fill="#F5A623" font-size="9" text-anchor="middle" opacity="0.5">vi</text>

  <!-- Bar 3: Fmaj7 (Subdominant/green) -->
  <rect x="198" y="524" width="83" height="56" rx="8" fill="#7ED321" opacity="0.12" stroke="#7ED321" stroke-width="1.5"/>
  <text x="239.5" y="549" fill="#7ED321" font-size="14" text-anchor="middle" font-weight="600">Fmaj7</text>
  <text x="239.5" y="566" fill="#7ED321" font-size="9" text-anchor="middle" opacity="0.5">IV</text>

  <!-- Bar 4: G7 (Dominant/blue) -->
  <rect x="289" y="524" width="83" height="56" rx="8" fill="#4A90D9" opacity="0.12" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="330.5" y="549" fill="#4A90D9" font-size="14" text-anchor="middle" font-weight="600">G7</text>
  <text x="330.5" y="566" fill="#4A90D9" font-size="9" text-anchor="middle" opacity="0.5">V</text>

  <!-- Playback cursor (at bar 3, beat 2) -->
  <line x1="248" y1="520" x2="248" y2="584" stroke="#F0F0F5" stroke-width="2" opacity="0.9"/>
  <circle cx="248" cy="520" r="3" fill="#F0F0F5" opacity="0.9"/>

  <!-- ── Pattern indicators below timeline ── -->
  <g transform="translate(12, 618)">
    <text x="45.5" y="12" fill="#F5A623" font-size="8" text-anchor="middle" opacity="0.5">BLOCK</text>
    <text x="136.5" y="12" fill="#F5A623" font-size="8" text-anchor="middle" opacity="0.5">BLOCK</text>
    <text x="227.5" y="12" fill="#7ED321" font-size="8" text-anchor="middle" opacity="0.5">ARP UP</text>
    <text x="318.5" y="12" fill="#4A90D9" font-size="8" text-anchor="middle" opacity="0.5">BLOCK</text>
  </g>

  <!-- ════════════════════════════════════════ -->
  <!-- SUGGESTION HINT (mini-bar)               -->
  <!-- ════════════════════════════════════════ -->
  <g transform="translate(12, 642)">
    <rect width="366" height="42" rx="10" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
    <!-- Lightbulb icon -->
    <circle cx="28" cy="21" r="8" fill="none" stroke="#F5A623" stroke-width="1.5" opacity="0.6"/>
