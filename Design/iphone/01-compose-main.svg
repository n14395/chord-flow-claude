    <text x="34" y="16" fill="#D94A8C" font-size="10" text-anchor="middle" font-weight="600">Jazz</text>
    <text x="34" y="36" fill="#6B6D82" font-size="8" text-anchor="middle">BORROWED</text>
  </g>

