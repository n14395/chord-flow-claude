  <!-- ════════════════════════════════════════ -->
  <text x="48" y="96" fill="#F0F0F5" font-size="26" font-weight="700">Export</text>
  <text x="48" y="120" fill="#8B8DA3" font-size="14">Share your progression in any format</text>

