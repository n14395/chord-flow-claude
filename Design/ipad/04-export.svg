    <style>
      text { font-family: -apple-system, 'SF Pro Rounded', 'Helvetica Neue', sans-serif; }
    </style>
  </defs>

  <rect width="1024" height="1366" rx="20" fill="#1A1B2E" stroke="#3A3D5C" stroke-width="2"/>

