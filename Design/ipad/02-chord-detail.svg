    <text x="225" y="295" fill="#F5A623" font-size="12" text-anchor="middle" font-weight="600">Cmaj7</text>
    <circle cx="290" cy="307" r="26" fill="#4A90D9" opacity="0.1" stroke="#4A90D9" stroke-width="1"/>
    <text x="290" y="312" fill="#4A90D9" font-size="11" text-anchor="middle">G7</text>
    <circle cx="160" cy="307" r="26" fill="#7ED321" opacity="0.1" stroke="#7ED321" stroke-width="1"/>
    <text x="160" y="312" fill="#7ED321" font-size="11" text-anchor="middle">Fmaj7</text>
    <circle cx="355" cy="420" r="26" fill="#F5A623" opacity="0.1" stroke="#F5A623" stroke-width="1"/>
    <text x="355" y="425" fill="#F5A623" font-size="11" text-anchor="middle">Am7</text>
