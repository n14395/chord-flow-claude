<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1366" width="1024" height="1366">
  <defs>
    <radialGradient id="glow-center-ipad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#1A1B2E" stop-opacity="0"/>
    </radialGradient>
    <filter id="popover-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="ipad-clip2">
      <rect width="1024" height="1366" rx="20"/>
    </clipPath>
    <style>
      text { font-family: -apple-system, 'SF Pro Rounded', 'Helvetica Neue', sans-serif; }
    </style>
  </defs>

  <!-- iPad frame -->
  <rect width="1024" height="1366" rx="20" fill="#1A1B2E" stroke="#3A3D5C" stroke-width="2"/>

  <g clip-path="url(#ipad-clip2)">

  <!-- Status bar -->
  <rect width="1024" height="48" fill="#1A1B2E"/>
  <text x="40" y="32" fill="#F0F0F5" font-size="15" font-weight="600">9:41</text>
  <text x="984" y="32" fill="#F0F0F5" font-size="13" font-weight="500" text-anchor="end">100%</text>

  <!-- Column divider -->
  <line x1="450" y1="60" x2="450" y2="1280" stroke="#252740" stroke-width="1"/>

  <!-- ── Left column: Circle of Fifths (dimmed) ── -->
  <text x="40" y="84" fill="#F0F0F5" font-size="20" font-weight="700" opacity="0.4">Compose</text>

  <g opacity="0.3">
