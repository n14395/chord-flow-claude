    <text x="16" y="16" fill="#7ED321" font-size="22" font-weight="700">Fmaj7</text>
    <text x="100" y="16" fill="#7ED321" font-size="14" opacity="0.6">IV</text>

    <rect x="120" y="2" width="88" height="20" rx="10" fill="#7ED321" opacity="0.12"/>
    <text x="164" y="16" fill="#7ED321" font-size="10" text-anchor="middle" font-weight="500">Subdominant</text>

