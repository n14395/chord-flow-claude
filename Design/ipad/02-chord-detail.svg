    <rect x="279" y="0" width="12" height="26" rx="2" fill="#1A1B2E" stroke="#3A3D5C" stroke-width="0.5"/>

    <!-- Note labels -->
    <text x="76" y="40" fill="#7ED321" font-size="7" text-anchor="middle" font-weight="600">F</text>
    <text x="120" y="40" fill="#7ED321" font-size="7" text-anchor="middle" font-weight="600">A</text>
    <text x="164" y="40" fill="#7ED321" font-size="7" text-anchor="middle" font-weight="600">C</text>
    <text x="296" y="40" fill="#7ED321" font-size="7" text-anchor="middle" font-weight="600">E</text>
