<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <radialGradient id="glow-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A90D9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4A90D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ED321" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7ED321" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-magenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D94A8C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D94A8C" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: -apple-system, 'SF Pro Rounded', 'Helvetica Neue', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#131425"/>

  <!-- Title -->
  <text x="40" y="52" fill="#F0F0F5" font-size="28" font-weight="700" letter-spacing="0.5">ChordFlow — Harmonic Orbit</text>
  <text x="40" y="76" fill="#8B8DA3" font-size="14" font-weight="500">Design Tokens Reference</text>
  <line x1="40" y1="96" x2="1160" y2="96" stroke="#3A3D5C" stroke-width="1"/>

  <!-- ════════════════════════════════════════ -->
  <!-- SECTION: Core Colors                     -->
  <!-- ════════════════════════════════════════ -->
  <text x="40" y="136" fill="#F0F0F5" font-size="18" font-weight="600">Core Colors</text>

  <!-- Background tiers -->
  <g transform="translate(40, 156)">
    <rect width="100" height="100" rx="12" fill="#0E0F1D"/>
    <text x="50" y="126" fill="#8B8DA3" font-size="11" text-anchor="middle" font-weight="500">Base</text>
    <text x="50" y="142" fill="#6B6D82" font-size="10" text-anchor="middle">#0E0F1D</text>
  </g>
  <g transform="translate(156, 156)">
    <rect width="100" height="100" rx="12" fill="#1A1B2E"/>
    <text x="50" y="126" fill="#8B8DA3" font-size="11" text-anchor="middle" font-weight="500">Background</text>
    <text x="50" y="142" fill="#6B6D82" font-size="10" text-anchor="middle">#1A1B2E</text>
  </g>
  <g transform="translate(272, 156)">
    <rect width="100" height="100" rx="12" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
    <text x="50" y="126" fill="#8B8DA3" font-size="11" text-anchor="middle" font-weight="500">Surface</text>
    <text x="50" y="142" fill="#6B6D82" font-size="10" text-anchor="middle">#252740</text>
  </g>
  <g transform="translate(388, 156)">
    <rect width="100" height="100" rx="12" fill="#2F3152" stroke="#3A3D5C" stroke-width="1"/>
    <text x="50" y="126" fill="#8B8DA3" font-size="11" text-anchor="middle" font-weight="500">Elevated</text>
    <text x="50" y="142" fill="#6B6D82" font-size="10" text-anchor="middle">#2F3152</text>
  </g>
  <g transform="translate(504, 156)">
    <rect width="100" height="100" rx="12" fill="#3A3D5C"/>
    <text x="50" y="126" fill="#8B8DA3" font-size="11" text-anchor="middle" font-weight="500">Border</text>
    <text x="50" y="142" fill="#6B6D82" font-size="10" text-anchor="middle">#3A3D5C</text>
  </g>

  <!-- Text colors -->
  <g transform="translate(660, 156)">
    <rect width="100" height="100" rx="12" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
    <text x="50" y="50" fill="#F0F0F5" font-size="16" text-anchor="middle" font-weight="600">Aa</text>
    <text x="50" y="70" fill="#F0F0F5" font-size="10" text-anchor="middle">Primary</text>
    <text x="50" y="126" fill="#8B8DA3" font-size="11" text-anchor="middle" font-weight="500">Text Primary</text>
    <text x="50" y="142" fill="#6B6D82" font-size="10" text-anchor="middle">#F0F0F5</text>
  </g>
  <g transform="translate(776, 156)">
    <rect width="100" height="100" rx="12" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
    <text x="50" y="50" fill="#8B8DA3" font-size="16" text-anchor="middle" font-weight="600">Aa</text>
    <text x="50" y="70" fill="#8B8DA3" font-size="10" text-anchor="middle">Secondary</text>
    <text x="50" y="126" fill="#8B8DA3" font-size="11" text-anchor="middle" font-weight="500">Text Secondary</text>
    <text x="50" y="142" fill="#6B6D82" font-size="10" text-anchor="middle">#8B8DA3</text>
  </g>
  <g transform="translate(892, 156)">
    <rect width="100" height="100" rx="12" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
    <text x="50" y="50" fill="#6B6D82" font-size="16" text-anchor="middle" font-weight="600">Aa</text>
    <text x="50" y="70" fill="#6B6D82" font-size="10" text-anchor="middle">Tertiary</text>
    <text x="50" y="126" fill="#8B8DA3" font-size="11" text-anchor="middle" font-weight="500">Text Tertiary</text>
    <text x="50" y="142" fill="#6B6D82" font-size="10" text-anchor="middle">#6B6D82</text>
  </g>

  <!-- ════════════════════════════════════════ -->
  <!-- SECTION: Harmonic Function Colors        -->
  <!-- ════════════════════════════════════════ -->
  <text x="40" y="350" fill="#F0F0F5" font-size="18" font-weight="600">Harmonic Function Colors</text>
  <text x="280" y="350" fill="#6B6D82" font-size="12">Color encodes musical function — warm=home, cool=tension, green=motion, magenta=borrowed</text>

  <!-- Tonic — Amber -->
  <g transform="translate(40, 370)">
    <rect width="140" height="90" rx="12" fill="#F5A623"/>
    <text x="70" y="42" fill="#1A1B2E" font-size="14" text-anchor="middle" font-weight="700">Tonic</text>
    <text x="70" y="62" fill="#1A1B2E" font-size="11" text-anchor="middle" opacity="0.7">I  iii  vi</text>
    <text x="70" y="108" fill="#8B8DA3" font-size="11" text-anchor="middle">#F5A623</text>

    <!-- Opacity variants -->
    <rect y="130" width="30" height="30" rx="6" fill="#F5A623" opacity="1"/>
    <text x="15" y="174" fill="#6B6D82" font-size="9" text-anchor="middle">100%</text>
    <rect x="36" y="130" width="30" height="30" rx="6" fill="#F5A623" opacity="0.6"/>
    <text x="51" y="174" fill="#6B6D82" font-size="9" text-anchor="middle">60%</text>
    <rect x="72" y="130" width="30" height="30" rx="6" fill="#F5A623" opacity="0.3"/>
    <text x="87" y="174" fill="#6B6D82" font-size="9" text-anchor="middle">30%</text>
    <rect x="108" y="130" width="30" height="30" rx="6" fill="#F5A623" opacity="0.12"/>
    <text x="123" y="174" fill="#6B6D82" font-size="9" text-anchor="middle">12%</text>
  </g>

  <!-- Dominant — Blue -->
  <g transform="translate(230, 370)">
    <rect width="140" height="90" rx="12" fill="#4A90D9"/>
    <text x="70" y="42" fill="#F0F0F5" font-size="14" text-anchor="middle" font-weight="700">Dominant</text>
    <text x="70" y="62" fill="#F0F0F5" font-size="11" text-anchor="middle" opacity="0.7">V  vii°</text>
    <text x="70" y="108" fill="#8B8DA3" font-size="11" text-anchor="middle">#4A90D9</text>

    <rect y="130" width="30" height="30" rx="6" fill="#4A90D9" opacity="1"/>
    <text x="15" y="174" fill="#6B6D82" font-size="9" text-anchor="middle">100%</text>
    <rect x="36" y="130" width="30" height="30" rx="6" fill="#4A90D9" opacity="0.6"/>
    <text x="51" y="174" fill="#6B6D82" font-size="9" text-anchor="middle">60%</text>
    <rect x="72" y="130" width="30" height="30" rx="6" fill="#4A90D9" opacity="0.3"/>
    <text x="87" y="174" fill="#6B6D82" font-size="9" text-anchor="middle">30%</text>
    <rect x="108" y="130" width="30" height="30" rx="6" fill="#4A90D9" opacity="0.12"/>
    <text x="123" y="174" fill="#6B6D82" font-size="9" text-anchor="middle">12%</text>
  </g>

  <!-- Subdominant — Green -->
  <g transform="translate(420, 370)">
    <rect width="140" height="90" rx="12" fill="#7ED321"/>
    <text x="70" y="42" fill="#1A1B2E" font-size="14" text-anchor="middle" font-weight="700">Subdominant</text>
    <text x="70" y="62" fill="#1A1B2E" font-size="11" text-anchor="middle" opacity="0.7">ii  IV</text>
    <text x="70" y="108" fill="#8B8DA3" font-size="11" text-anchor="middle">#7ED321</text>

    <rect y="130" width="30" height="30" rx="6" fill="#7ED321" opacity="1"/>
    <text x="15" y="174" fill="#6B6D82" font-size="9" text-anchor="middle">100%</text>
    <rect x="36" y="130" width="30" height="30" rx="6" fill="#7ED321" opacity="0.6"/>
    <text x="51" y="174" fill="#6B6D82" font-size="9" text-anchor="middle">60%</text>
    <rect x="72" y="130" width="30" height="30" rx="6" fill="#7ED321" opacity="0.3"/>
    <text x="87" y="174" fill="#6B6D82" font-size="9" text-anchor="middle">30%</text>
    <rect x="108" y="130" width="30" height="30" rx="6" fill="#7ED321" opacity="0.12"/>
    <text x="123" y="174" fill="#6B6D82" font-size="9" text-anchor="middle">12%</text>
  </g>

  <!-- Borrowed — Magenta -->
  <g transform="translate(610, 370)">
    <rect width="140" height="90" rx="12" fill="#D94A8C"/>
    <text x="70" y="42" fill="#F0F0F5" font-size="14" text-anchor="middle" font-weight="700">Borrowed</text>
    <text x="70" y="62" fill="#F0F0F5" font-size="11" text-anchor="middle" opacity="0.7">bIII  bVI  bVII ...</text>
    <text x="70" y="108" fill="#8B8DA3" font-size="11" text-anchor="middle">#D94A8C</text>

    <rect y="130" width="30" height="30" rx="6" fill="#D94A8C" opacity="1"/>
    <text x="15" y="174" fill="#6B6D82" font-size="9" text-anchor="middle">100%</text>
    <rect x="36" y="130" width="30" height="30" rx="6" fill="#D94A8C" opacity="0.6"/>
    <text x="51" y="174" fill="#6B6D82" font-size="9" text-anchor="middle">60%</text>
    <rect x="72" y="130" width="30" height="30" rx="6" fill="#D94A8C" opacity="0.3"/>
    <text x="87" y="174" fill="#6B6D82" font-size="9" text-anchor="middle">30%</text>
    <rect x="108" y="130" width="30" height="30" rx="6" fill="#D94A8C" opacity="0.12"/>
    <text x="123" y="174" fill="#6B6D82" font-size="9" text-anchor="middle">12%</text>
  </g>

  <!-- Accent Glow demo -->
  <g transform="translate(810, 370)">
    <rect width="140" height="90" rx="12" fill="#252740" stroke="#3A3D5C" stroke-width="1"/>
    <circle cx="70" cy="45" r="30" fill="url(#glow-amber)"/>
    <circle cx="70" cy="45" r="12" fill="#F5A623"/>
    <text x="70" y="49" fill="#1A1B2E" font-size="9" text-anchor="middle" font-weight="700">I</text>
    <text x="70" y="80" fill="#8B8DA3" font-size="10" text-anchor="middle">Selected Glow</text>
    <text x="70" y="108" fill="#6B6D82" font-size="11" text-anchor="middle">Radial gradient</text>
  </g>

  <!-- ════════════════════════════════════════ -->
  <!-- SECTION: Typography                      -->
  <!-- ════════════════════════════════════════ -->
  <text x="40" y="605" fill="#F0F0F5" font-size="18" font-weight="600">Typography</text>
  <text x="165" y="605" fill="#6B6D82" font-size="12">SF Pro Rounded — system font with rounded design variant</text>

  <g transform="translate(40, 625)">
    <!-- Display -->
    <text x="0" y="32" fill="#F0F0F5" font-size="28" font-weight="700">C Major</text>
    <text x="200" y="24" fill="#6B6D82" font-size="11">Display / 28pt / Bold</text>
    <text x="200" y="38" fill="#6B6D82" font-size="11">Key label, center of circle</text>

    <!-- Heading -->
    <text x="0" y="76" fill="#F0F0F5" font-size="20" font-weight="600">Next Chord</text>
    <text x="200" y="68" fill="#6B6D82" font-size="11">Heading / 20pt / Semibold</text>
    <text x="200" y="82" fill="#6B6D82" font-size="11">Section headers, panel titles</text>

    <!-- Chord Symbol -->
    <text x="0" y="116" fill="#F5A623" font-size="17" font-weight="600">Cmaj7</text>
    <text x="200" y="108" fill="#6B6D82" font-size="11">Chord Symbol / 17pt / Semibold</text>
    <text x="200" y="122" fill="#6B6D82" font-size="11">Chord names in timeline + nodes</text>

    <!-- Body -->
    <text x="0" y="154" fill="#F0F0F5" font-size="15" font-weight="400">Smooth voice leading</text>
    <text x="200" y="146" fill="#6B6D82" font-size="11">Body / 15pt / Regular</text>
    <text x="200" y="160" fill="#6B6D82" font-size="11">Suggestion reasons, descriptions</text>

    <!-- Caption -->
    <text x="0" y="190" fill="#8B8DA3" font-size="12" font-weight="500">TENSION</text>
    <text x="200" y="182" fill="#6B6D82" font-size="11">Caption / 12pt / Medium / Uppercase</text>
    <text x="200" y="196" fill="#6B6D82" font-size="11">Control labels, section tags</text>

    <!-- Monospaced -->
    <text x="0" y="224" fill="#F0F0F5" font-size="14" font-weight="500" font-family="'SF Mono', 'Menlo', monospace">120 BPM</text>
    <text x="200" y="216" fill="#6B6D82" font-size="11">Mono / 14pt / Medium</text>
    <text x="200" y="230" fill="#6B6D82" font-size="11">Tempo, bar/beat counters</text>
  </g>

  <!-- ════════════════════════════════════════ -->
  <!-- SECTION: Spacing + Radius                -->
  <!-- ════════════════════════════════════════ -->
  <text x="620" y="605" fill="#F0F0F5" font-size="18" font-weight="600">Spacing &amp; Radius</text>

  <g transform="translate(620, 625)">
    <!-- Spacing scale -->
    <text x="0" y="16" fill="#8B8DA3" font-size="11" font-weight="500">SPACING SCALE (4px base)</text>

    <rect x="0" y="28" width="4" height="16" rx="2" fill="#4A90D9" opacity="0.6"/>
    <text x="14" y="40" fill="#6B6D82" font-size="10">4px — micro</text>

    <rect x="0" y="52" width="8" height="16" rx="2" fill="#4A90D9" opacity="0.6"/>
    <text x="18" y="64" fill="#6B6D82" font-size="10">8px — tight</text>

    <rect x="0" y="76" width="12" height="16" rx="2" fill="#4A90D9" opacity="0.6"/>
    <text x="22" y="88" fill="#6B6D82" font-size="10">12px — compact</text>

    <rect x="0" y="100" width="16" height="16" rx="2" fill="#4A90D9" opacity="0.6"/>
    <text x="26" y="112" fill="#6B6D82" font-size="10">16px — default</text>

    <rect x="0" y="124" width="24" height="16" rx="2" fill="#4A90D9" opacity="0.6"/>
    <text x="34" y="136" fill="#6B6D82" font-size="10">24px — spacious</text>

    <rect x="0" y="148" width="32" height="16" rx="2" fill="#4A90D9" opacity="0.6"/>
    <text x="42" y="160" fill="#6B6D82" font-size="10">32px — section gap</text>

    <rect x="0" y="172" width="48" height="16" rx="2" fill="#4A90D9" opacity="0.6"/>
    <text x="58" y="184" fill="#6B6D82" font-size="10">48px — page margin</text>
  </g>

  <g transform="translate(880, 625)">
    <!-- Corner radius -->
    <text x="0" y="16" fill="#8B8DA3" font-size="11" font-weight="500">CORNER RADIUS</text>

    <rect x="0" y="28" width="60" height="36" rx="4" fill="none" stroke="#F0F0F5" stroke-width="1" opacity="0.4"/>
    <text x="70" y="50" fill="#6B6D82" font-size="10">4px — small buttons</text>

    <rect x="0" y="76" width="60" height="36" rx="8" fill="none" stroke="#F0F0F5" stroke-width="1" opacity="0.4"/>
    <text x="70" y="98" fill="#6B6D82" font-size="10">8px — buttons, pills</text>

    <rect x="0" y="124" width="60" height="36" rx="12" fill="none" stroke="#F0F0F5" stroke-width="1" opacity="0.4"/>
    <text x="70" y="146" fill="#6B6D82" font-size="10">12px — cards, panels</text>

    <rect x="0" y="172" width="60" height="36" rx="18" fill="none" stroke="#F0F0F5" stroke-width="1" opacity="0.4"/>
    <text x="70" y="194" fill="#6B6D82" font-size="10">full — circles, knobs</text>
  </g>

  <!-- Footer -->
  <line x1="40" y1="870" x2="1160" y2="870" stroke="#3A3D5C" stroke-width="1"/>
  <text x="40" y="890" fill="#6B6D82" font-size="11">ChordFlow — Harmonic Orbit Design System v1.0</text>
  <text x="1160" y="890" fill="#6B6D82" font-size="11" text-anchor="end">Page 5 of 6</text>
</svg>
