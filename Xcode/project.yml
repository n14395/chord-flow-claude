name: ChordFlow
options:
  bundleIdPrefix: com.n14395.chordflow2
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.n14395.chordflow2
    SWIFT_VERSION: 5.0
targets:
  ChordFlowShared:
    type: framework
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: Shared
        group: Xcode/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.chordflow2.shared
        DEVELOPMENT_TEAM: P52946XHRJ
        CODE_SIGN_STYLE: Automatic
    info:
      path: Shared/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"

  ChordFlowApp:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: ChordFlowApp
        group: Xcode/ChordFlowApp
    settings:
      base:
        PRODUCT_NAME: ChordFlow
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.chordflow2
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: P52946XHRJ
        CODE_SIGN_STYLE: Automatic
    info:
      path: ChordFlowApp/Info.plist
      properties:
        CFBundleDisplayName: ChordFlow2
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
    dependencies:
      - target: ChordFlowShared
      - target: ChordFlowAUv3
        embed: true
        codeSign: true

  ChordFlowAUv3:
    type: app-extension
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: ChordFlowAUv3
        group: Xcode/ChordFlowAUv3
    settings:
      base:
        PRODUCT_NAME: ChordFlow AUv3
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.chordflow2.auv3
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: YES
        DEVELOPMENT_TEAM: P52946XHRJ
        CODE_SIGN_STYLE: Automatic
        EAGER_LINKING: NO
        ENABLE_DEBUG_DYLIB: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
          - "@loader_path/Frameworks"
          - "@loader_path/../../Frameworks"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
        OTHER_LDFLAGS:
          - "-framework"
          - "CoreAudioKit"
    info:
      path: ChordFlowAUv3/Info.plist
      properties:
        CFBundleDisplayName: ChordFlow AUv3
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionMainStoryboard: MainInterface
          NSExtensionAttributes:
            AudioComponents:
              - type: aumi
                subtype: chrd
                manufacturer: NWF1
                name: ChordFlow MIDI FX
                description: Harmonic suggestion MIDI effect
                version: 2
                sandboxSafe: true
                tags: [Effects, MIDI]
    dependencies:
      - target: ChordFlowShared
        embed: true
        codeSign: true

  ChordFlowHostHarness:
    type: tool
    platform: macOS
    sources:
      - path: HostHarness
        group: Xcode/HostHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.chordflow2.hostharness
        DEVELOPMENT_TEAM: P52946XHRJ
        CODE_SIGN_STYLE: Automatic
    info:
      path: HostHarness/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"

  ChordFlowHostHarnessTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HostHarnessTests
        group: Xcode/HostHarnessTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.chordflow2.hostharness.tests
        DEVELOPMENT_TEAM: P52946XHRJ
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: ""
        BUNDLE_LOADER: ""
schemes:
  ChordFlowApp:
    build:
      targets:
        ChordFlowApp: all
    run:
      config: Debug
  ChordFlowAUv3:
    build:
      targets:
        ChordFlowAUv3: all
  ChordFlowHostHarness:
    build:
      targets:
        ChordFlowHostHarness: all
    test:
      targets:
        - name: ChordFlowHostHarnessTests
