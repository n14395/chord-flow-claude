<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background radial gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#222444"/>
      <stop offset="100%" stop-color="#1A1B2E"/>
    </radialGradient>

    <!-- Trail gradient (follows block colors, fades at ends) -->
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#F5A623" stop-opacity="0"/>
      <stop offset="12%"  stop-color="#F5A623" stop-opacity="1"/>
      <stop offset="35%"  stop-color="#7ED321" stop-opacity="1"/>
      <stop offset="62%"  stop-color="#4A90D9" stop-opacity="1"/>
      <stop offset="88%"  stop-color="#D94A8C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D94A8C" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background fill -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!--
    Flowing trail — a smooth ascending arc connecting the block centers.
    Extends beyond the first and last block to suggest continuation.
    Centers: (290,625) (460,530) (615,440) (755,360)
  -->
  <path
    d="M 120 710 C 300 590, 620 400, 910 280"
    fill="none"
    stroke="url(#trailGrad)"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.35"
  />

  <!--
    Four chord blocks, drawn back-to-front (1 at back, 4 on top).
    Each overlaps the previous by ~35-40px horizontally.
    Sizes decrease: 220x140 → 200x130 → 180x120 → 160x110.

    1. Gold  (#F5A623 tonic)        (180, 555)  220x140  rx=24
    2. Green (#7ED321 subdominant)   (360, 465)  200x130  rx=22
    3. Blue  (#4A90D9 dominant)      (525, 380)  180x120  rx=20
    4. Pink  (#D94A8C borrowed)      (675, 305)  160x110  rx=18
  -->

  <!-- Block 1: Gold / Tonic -->
  <rect x="180" y="555" width="220" height="140" rx="24" ry="24"
        fill="#F5A623" filter="url(#shadow)"/>
  <rect x="180" y="555" width="220" height="140" rx="24" ry="24"
        fill="none" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Block 2: Green / Subdominant -->
  <rect x="360" y="465" width="200" height="130" rx="22" ry="22"
        fill="#7ED321" filter="url(#shadow)"/>
  <rect x="360" y="465" width="200" height="130" rx="22" ry="22"
        fill="none" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Block 3: Blue / Dominant -->
  <rect x="525" y="380" width="180" height="120" rx="20" ry="20"
        fill="#4A90D9" filter="url(#shadow)"/>
  <rect x="525" y="380" width="180" height="120" rx="20" ry="20"
        fill="none" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Block 4: Pink / Borrowed -->
  <rect x="675" y="305" width="160" height="110" rx="18" ry="18"
        fill="#D94A8C" filter="url(#shadow)"/>
  <rect x="675" y="305" width="160" height="110" rx="18" ry="18"
        fill="none" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>
</svg>
